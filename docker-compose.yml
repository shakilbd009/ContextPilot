name: contextpilot-phase-0

services:
  postgres:
    image: postgres:16-alpine
    container_name: contextpilot-db
    environment:
      POSTGRES_USER: contextpilot
      POSTGRES_PASSWORD: contextpilot
      POSTGRES_DB: contextpilot
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextpilot -d contextpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contextpilot-cache
    ports:
      - "${CACHE_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    container_name: contextpilot-backend
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      SERVER_PORT: "3000"
      DATABASE_URL: postgres://contextpilot:contextpilot@postgres:5432/contextpilot?sslmode=disable
      REDIS_URL: redis://redis:6379
      # CWE-770: must match .env.example. Setting this to 0 (or omitting
      # the var and letting the older binary default) silently disables
      # the import rate limiter at the main.go gate. Keep aligned with
      # config.DefaultRateLimitImportMaxRequests and docs/security-baseline.md.
      RATE_LIMIT_IMPORT_MAX_REQUESTS: "100"
      RATE_LIMIT_IMPORT_WINDOW_SECS: "60"
      ENVIRONMENT: development
      FF_ENABLE_APP_SHELL: "false"
      FF_ENABLE_UPCOMING_MEETINGS: "true"
      FF_ENABLE_MANUAL_MEETING_IMPORT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend-dev
    container_name: contextpilot-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      VITE_SERVER_URL: http://host.docker.internal:3000
      VITE_FF_ENABLE_MANUAL_MEETING_IMPORT: "true"
      VITE_FF_ENABLE_APP_SHELL: "true"
      # Upcoming-meetings flags: both namespaces must be set so the
      # SvelteKit /api/upcoming* +server.ts handlers (server-side, read
      # FF_ENABLE_UPCOMING_MEETINGS from $env/dynamic/private) accept
      # requests, and the browser-side /upcoming page can render the
      # form branch (reads VITE_FF_ENABLE_UPCOMING_MEETINGS at build /
      # via import.meta.env). Without these the API returns 403
      # feature_disabled and the /upcoming/new page renders the
      # "not enabled" alert instead of the create form. Mirrors
      # .env.example and was the missing env in the E2E container for
      # t_b48e503b.
      VITE_FF_ENABLE_UPCOMING_MEETINGS: "true"
      FF_ENABLE_UPCOMING_MEETINGS: "true"
      FF_ENABLE_MANUAL_MEETING_IMPORT: "true"
      FF_ENABLE_APP_SHELL: "true"
      SERVER_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    command: pnpm dev --host

  mailpit:
    image: axllent/mailpit:latest
    container_name: contextpilot-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  frontend_modules:

# Common port conflicts:
#   5432 — PostgreSQL (may conflict with local pg install)
#   6379 — Redis (may conflict with local redis install)
#   1025 — Mailpit SMTP
#   8025 — Mailpit Web UI
#   3000 — Backend (Phase 1+)
#   5173 — Frontend (Phase 1+)
#
# Override with environment variables:
#   DATABASE_PORT=5433 make dev
#   CACHE_PORT=6380 make dev
#   APP_PORT=3001 make dev